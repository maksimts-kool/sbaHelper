# Weekly dependency update PRs. Each PR runs the full CI (tests, audit,
# container build and startup checks); nothing is merged or deployed
# automatically — merging to main is what ships, so review before merging.
version: 2
updates:
  # Python packages in uv.lock (python-telegram-bot, yt-dlp, test tools).
  - package-ecosystem: "uv"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 5
    groups:
      dev-tools:
        dependency-type: "development"
    commit-message:
      prefix: "deps"

  # Base images in the Dockerfile (python, uv, deno).
  - package-ecosystem: "docker"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    commit-message:
      prefix: "docker"

  # Actions are pinned to commit SHAs; Dependabot bumps the SHA and the comment.
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    groups:
      actions:
        patterns: ["*"]
    commit-message:
      prefix: "ci"

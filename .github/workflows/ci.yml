name: CI

on:
  push:
  pull_request:

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Ruff lint
        run: ruff check .

      - name: Ruff format check
        run: ruff format --check .

      - name: Pytest
        run: pytest

  publish:
    # Образ для Portainer/Watchtower: только с main и только после зелёного прогона,
    # иначе Watchtower выкатит в прод непроверенный коммит.
    needs: lint-and-test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          # GHCR требует имя в нижнем регистре, поэтому оно записано явно,
          # а не через ${{ github.repository }}.
          tags: |
            ghcr.io/maksimts-kool/sbahelper:latest
            ghcr.io/maksimts-kool/sbahelper:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

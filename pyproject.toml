[project]
name = "sbahelper"
version = "2.0.0"
description = "Telegram bot that downloads short vertical videos from TikTok and YouTube Shorts."
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "python-telegram-bot[job-queue]>=22.8",
    # curl-cffi gives yt-dlp browser impersonation; without it TikTok serves a bot page.
    "yt-dlp[default,curl-cffi]>=2026.8.19",
]

[dependency-groups]
dev = [
    "pytest>=9.1",
    "ruff>=0.16",
]

[tool.uv]
package = false

[tool.ruff]
line-length = 100
target-version = "py314"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "C4", "RUF"]
# Russian bot copy legitimately contains Cyrillic look-alike characters.
ignore = ["RUF001", "RUF002", "RUF003"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "C4"]

[tool.ruff.lint.per-file-ignores]
# Tests install runtime stubs before importing the modules under test (E402),
# and use nested `with patch(...) / assertRaises(...)` blocks (SIM117).
"tests/**" = ["E402", "SIM117"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

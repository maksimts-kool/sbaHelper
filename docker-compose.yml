# Local development: builds from source and keeps state in ./data
# (stats database and ./data/cookies). Copy .env.example to .env first.
# Production runs docker-compose.portainer.yml instead.
services:
  downloader-bot:
    build: .
    container_name: downloader-bot
    restart: unless-stopped
    env_file:
      - path: .env
        required: false
    volumes:
      - ./data:/data

services:
  sbaradio-tts:
    build: .
    container_name: sbaradio-tts
    restart: unless-stopped
    environment:
      AZURACAST_HOST: https://radio.maksimtsikvasvili24.thkit.ee
      STATION_ID: 2
      API_KEY: 25caf2bc8383d480:3c911d2dff69a0f70c7d9b7841e3c1d4
      TTS_VOICE: ru-RU-SvetlanaNeural
      INTRO_FILE_TEXT: intro
      PYTHONUNBUFFERED: "1"

  sbaradio-bot:
    build: .
    container_name: sbaradio-bot
    restart: unless-stopped
    # Используем тот же образ, но запускаем другой скрипт
    command: [ "python", "bot.py" ]
    volumes:
      - ./bot_data:/app/bot_data # Сохранение данных аналитики при перезагрузке
    environment:
      AZURACAST_HOST: https://radio.maksimtsikvasvili24.thkit.ee
      STATION_ID: 2
      # Вставьте НОВЫЙ ключ ниже
      API_KEY: 25caf2bc8383d480:3c911d2dff69a0f70c7d9b7841e3c1d4
      # Токен от BotFather
      TELEGRAM_TOKEN: 8341924840:AAH20deTIjsgerZyt-ryJTrsiOB0rqmkPvw
      TZ: Europe/Tallinn
      PYTHONUNBUFFERED: "1"

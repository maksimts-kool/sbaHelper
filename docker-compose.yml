services:
  downloader-bot:
    build: .
    # image: ghcr.io/<owner>/sbahelper:latest   # set for Watchtower auto-updates
    container_name: downloader-bot
    restart: unless-stopped
    env_file: .env
    volumes:
      - ./downloader/cookies:/app/cookies
      - /tmp/downloader_videos:/tmp/downloader_videos
    labels: ["com.centurylinklabs.watchtower.enable=true"]

  umap-route-bot:
    build: .
    container_name: umap-route-bot
    restart: unless-stopped
    command: ["python", "-m", "umap.bot"]
    env_file: .env
    volumes:
      - ./data:/data                 # SQLite state lives here
    labels: ["com.centurylinklabs.watchtower.enable=true"]

  watchtower:                        # opt-in: `docker compose --profile watchtower up -d`
    image: nickfedor/watchtower
    restart: unless-stopped
    profiles: ["watchtower"]
    volumes: ["/var/run/docker.sock:/var/run/docker.sock"]
    command: --cleanup --label-enable --interval 3600

# Portainer → Stacks → Add stack → Web editor: paste this file and set the
# stack environment variables (see README.md). Only DOWNLOADER_BOT_TOKEN is
# required; an unset variable falls back to the default in sbahelper/config.py.
#
# Watchtower pulls a new :latest (published by CI after green tests on main)
# every hour and restarts the bot. It runs without a compose profile because
# Portainer's UI cannot select profiles.

services:
  downloader-bot:
    image: ghcr.io/maksimts-kool/sbahelper:latest
    container_name: downloader-bot
    restart: unless-stopped
    environment:
      DOWNLOADER_BOT_TOKEN: "${DOWNLOADER_BOT_TOKEN:?set DOWNLOADER_BOT_TOKEN in the stack environment}"
      ALLOWED_CHAT_IDS: "${ALLOWED_CHAT_IDS:-}"
      ADMIN_IDS: "${ADMIN_IDS:-}"
      TZ: "${TZ:-Europe/Tallinn}"
      LOG_LEVEL: "${LOG_LEVEL:-}"
      MAX_FILE_SIZE_MB: "${MAX_FILE_SIZE_MB:-}"
      MAX_SHORT_DURATION_SEC: "${MAX_SHORT_DURATION_SEC:-}"
      CHECK_TIKTOK_URL: "${CHECK_TIKTOK_URL:-}"
      CHECK_YOUTUBE_URL: "${CHECK_YOUTUBE_URL:-}"
      STATS_ENABLED: "${STATS_ENABLED:-}"
      STATS_WEEKLY_WEEKDAY: "${STATS_WEEKLY_WEEKDAY:-}"
      STATS_WEEKLY_TIME: "${STATS_WEEKLY_TIME:-}"
      STATS_RETENTION_DAYS: "${STATS_RETENTION_DAYS:-}"
    volumes:
      - stats-data:/data
      # Cookie files. The bot also writes here when an admin sends it cookies,
      # and imports any other *.txt / *.json dropped in on startup.
      - "${COOKIES_HOST_DIR:-/opt/sbahelper/cookies}:/data/cookies"
    labels: ["com.centurylinklabs.watchtower.enable=true"]
    logging:
      driver: json-file
      options: { max-size: "10m", max-file: "3" }

  watchtower:
    image: nickfedor/watchtower
    container_name: downloader-watchtower
    restart: unless-stopped
    volumes: ["/var/run/docker.sock:/var/run/docker.sock"]
    command: --cleanup --label-enable --interval 3600
    logging:
      driver: json-file
      options: { max-size: "10m", max-file: "3" }

volumes:
  stats-data:
